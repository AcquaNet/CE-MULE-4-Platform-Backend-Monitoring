# Heap settings (MB), appended to MuleSoft's stock conf/wrapper.conf at image build (same key = override,
# the later definition wins). conf/wrapper-additional.conf is regenerated by Mule on every start.
# Other JVM flags go as -M<flag> in entypoints/mule-start.sh: wrapper 3.2.x stops at the first index
# gap and stock indexes differ per Mule version, so no wrapper.java.additional.N lines here.
# From the container env (the Runtime Manager sets them per pool; image defaults in the Dockerfile).
# Not -M-Xms/-Xmx flags: the wrapper puts these after all -M args, so they would always win.
wrapper.java.initmemory=%MULE_INIT_HEAP_MB%
wrapper.java.maxmemory=%MULE_MAX_HEAP_MB%
