<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Runtime Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Cpath d='M4 11V5l4 3 4-3v6' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; --bg:#f4f5f7; --surface:#fcfcfb; --line:#e2e4e8; --text:#0b0b0b; --text-2:#52514e;
          --accent:#2a78d6; --critical-ink:#b42626; --chip-bad:#fbe9e9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg:#121211; --surface:#1a1a19; --line:#2e2e2b; --text:#f0efec;
      --text-2:#c3c2b7; --accent:#3987e5; --critical-ink:#ef7a7a; --chip-bad:#3a1a1a; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#121211; --surface:#1a1a19; --line:#2e2e2b; --text:#f0efec;
    --text-2:#c3c2b7; --accent:#3987e5; --critical-ink:#ef7a7a; --chip-bad:#3a1a1a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width:min(400px, 100%); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px 28px; text-align:center; }
  h1 { font-size:20px; margin:16px 0 6px; }
  p { color:var(--text-2); margin:0 0 22px; }
  a.btn { display:block; padding:10px 14px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  a.btn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .err { background:var(--chip-bad); color:var(--critical-ink); border-radius:8px; padding:10px 12px; margin:0 0 18px; text-align:left; font-size:13px; }
  .foot { margin-top:18px; font-size:12px; color:var(--text-2); }
</style>
</head>
<body>
<main class="card">
  <svg width="44" height="44" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="var(--accent)"/><path d="M4 11V5l4 3 4-3v6" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
  <h1>Runtime Manager</h1>
  <p>Deploy, scale and monitor Mule applications.</p>
  <div class="err" id="err" role="alert" hidden></div>
  <a class="btn" href="login">Sign in with Keycloak</a>
  <div class="foot" id="foot">Uses your platform account. Access needs the operator role.</div>
</main>
<script>
  const e = new URLSearchParams(location.search).get('error');
  if (e) {
    const el = document.getElementById('err');
    el.textContent = e; el.hidden = false;
    // signed in to Keycloak with the wrong account: offer to switch
    if (/lacks the/.test(e)) document.getElementById('foot').innerHTML = '<a href="logout">Sign out of Keycloak</a> to use another account.';
    history.replaceState(null, '', location.pathname);
  }
</script>
</body>
</html>
