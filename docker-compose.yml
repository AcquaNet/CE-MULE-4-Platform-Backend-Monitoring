# Mule platform: APISIX gateway, Runtime Manager (Mule worker pools), OpenSearch + Dashboards + Fluent Bit (logs),
# Jaeger v2 (traces), Prometheus/Grafana/Alertmanager, Keycloak (single sign-on), MySQL, ActiveMQ.
#
# HTTPS on 9443 is always on once certs exist (config/scripts/setup/generate-certs.sh).
#

# Fixed project name so volume names (dockerelasticsearch_opensearch-data, ...) don't
# depend on the folder this repo is cloned into. Kept as-is to reuse existing data.
name: dockerelasticsearch

# One `docker compose up -d` starts this stack + the Mule platform (mule/docker-compose.yml,
# paths relative to mule/). Everything is configured in this folder's .env.
#
# Parts are compose profiles, picked with COMPOSE_PROFILES in .env (or `--profile x`).
# Always on (no profile): apisix + the Runtime Manager, which runs the Mule workers (runtime pools).
#   db          MySQL                      mq       ActiveMQ
#   logging     OpenSearch, Dashboards, Fluent Bit
#   tracing     Jaeger (+ OpenSearch as its storage)
#   monitoring  Prometheus, Grafana        alerting Alertmanager (+ Prometheus)
#   auth        Keycloak (+ its Postgres). Without it set GATEWAY_AUTH=off, or /api/* rejects every call.
#   opensearch-monitoring  OpenSearch exporter
# `docker compose build` / image export only touch the active profiles.
include:
  - path: mule/docker-compose.yml
    env_file: .env   # one .env for everything (default would be mule/.env)

services:
  #
  # OpenSearch - logs and trace storage
  # Includes FREE Document-Level Security for multi-tenancy
  #
  opensearch:
    profiles: [logging, tracing, opensearch-monitoring]
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.7}
    container_name: opensearch
    environment:
      - node.name=${NODE_NAME:-opensearch}
      - cluster.name=${OPENSEARCH_CLUSTER_NAME:-opensearch-cluster}
      - discovery.type=${DISCOVERY_TYPE:-single-node}
      - bootstrap.memory_lock=true
      # 512m is plenty for a dev/test volume of logs and spans; raise it (and the host RAM) for production
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      # Performance Analyzer runs a second JVM (~170 MB) nobody reads here
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      # admin password, applied when the security index is first created (2.12+; wipe opensearch-data to change it)
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - OPENSEARCH_HOST=localhost:9200
      # no demo config (public certs, users with published passwords): scripts/opensearch-start.sh sets up security
      - DISABLE_INSTALL_DEMO_CONFIG=true
    # index templates + tenant roles: setup-opensearch.sh runs in the background once the cluster answers
    # (idempotent, every start), so there is no separate one-shot setup container
    entrypoint: ["bash", "/usr/share/opensearch/opensearch-start.sh"]
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./scripts/setup-opensearch.sh:/usr/share/opensearch/setup-opensearch.sh:ro
      - ./scripts/opensearch-start.sh:/usr/share/opensearch/opensearch-start.sh:ro
    # Ports removed - access via APISIX gateway at /opensearch
    expose:
      - "9200"
      - "9300"
      - "9600"  # Performance Analyzer
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.10
      ce-base-network:
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always   # back after a Docker/host restart (Jaeger, Fluent Bit, Dashboards need it)

  #
  # OpenSearch Dashboards - log search (Keycloak sign-in)
  #
  opensearch-dashboards:
    profiles: [logging]
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-2.19.7}
    container_name: opensearch-dashboards
    # image entrypoint + index patterns mule-logs-*, logstash-*, jaeger-span-* in the Global tenant (created when missing)
    entrypoint: ["bash", "/usr/share/opensearch-dashboards/start.sh"]
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - SERVER_BASEPATH=/dashboards
      - SERVER_REWRITEBASEPATH=true
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      # read by the mounted opensearch_dashboards.yml (sign-in with Keycloak, client dashboards)
      - DASHBOARDS_OIDC_CLIENT_SECRET=${DASHBOARDS_OIDC_CLIENT_SECRET}
      - DASHBOARDS_COOKIE_SECRET=${DASHBOARDS_COOKIE_SECRET}
    volumes:
      # dashboards-on.yml = Keycloak sign-in, dashboards-off.yml = OpenSearch user/password (GATEWAY_AUTH=off)
      - ./config/opensearch-dashboards/dashboards-${GATEWAY_AUTH:-on}.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - ./config/opensearch-dashboards/start.sh:/usr/share/opensearch-dashboards/start.sh:ro
    expose:
      - "5601"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.12
      ce-base-network:
    depends_on:
      opensearch:
        condition: service_healthy
      keycloak:   # the openid sign-in reads Keycloak's discovery document at startup
        condition: service_healthy
        required: false
    healthcheck:
      # OpenSearch Dashboards doesn't have /api/status, use root path
      test: ["CMD-SHELL", "curl -f http://localhost:5601/dashboards/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always   # back after a Docker/host restart (Jaeger, Fluent Bit, Dashboards need it)

  #
  # Fluent Bit - log ingestion
  # JSON events on TCP/UDP 5000 (Mule log4j Socket appender) -> OpenSearch mule-logs-* / logstash-*.
  # Events need auth_token = LOG_INGEST_TOKEN. Reached as log-ingest:5000 inside the network and through
  # APISIX's stream proxy on localhost:9100 from outside (CloudHub).
  #
  fluent-bit:
    profiles: [logging]
    build: ./config/fluent-bit
    image: ce-fluent-bit:5.1.4
    container_name: fluent-bit
    environment:
      - LOG_INGEST_TOKEN=${LOG_INGEST_TOKEN}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    expose:
      - "5000"           # TCP/UDP JSON input (via APISIX stream proxy :9100 from outside)
      - "2020"           # health + Prometheus metrics (/api/v1/metrics/prometheus)
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.11
        aliases: [log-ingest]
      ce-base-network:
        aliases: [log-ingest]
    depends_on:
      opensearch:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  #
  # Log archiver: the only thing that deletes logs/traces in OpenSearch (no ISM). Rules (time, disk), per-app knobs,
  # archive filters and destinations (disk folders, S3) are set in its UI at /log-archiver/ (admin SSO; the gateway
  # sends X-Gateway-Key = LOG_ARCHIVER_TOKEN). Config/state in volume log-archiver-data, archives in ./volumes/log-archive.
  # The LOGS_*/JAEGER_* values seed the config on the first start only.
  #
  log-archiver:
    profiles: [logging, tracing]
    build: ./log-archiver
    image: ce-log-archiver:1.0
    container_name: log-archiver
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - LOG_ARCHIVER_TOKEN=${LOG_ARCHIVER_TOKEN:-}
      - LOG_ARCHIVER_SECRETS_KEY=${LOG_ARCHIVER_SECRETS_KEY:-}
      - LOGS_RETENTION_DAYS=${LOGS_RETENTION_DAYS:-365}
      - LOGS_DISK_MAX_PERCENT=${LOGS_DISK_MAX_PERCENT:-80}
      - JAEGER_RETENTION_DAYS=${JAEGER_RETENTION_DAYS:-7}
      - LOG_ARCHIVE_INTERVAL=${LOG_ARCHIVE_INTERVAL:-300}
    volumes:
      - log-archiver-data:/data
      - ./volumes/log-archive:/archive
    expose:
      - "8080"
    networks:
      - ce-base-micronet
      - ce-base-network   # S3
    depends_on:
      opensearch:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  #
  # Jaeger v2 - Distributed Tracing: OTLP from the OpenTelemetry Mule 4 agent, spans stored in OpenSearch.
  # Configured by config/jaeger/config.yaml (v2 has no SPAN_STORAGE_TYPE/ES_* env vars).
  #
  jaeger:
    profiles: [tracing]
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.22.0}
    container_name: jaeger
    command: ["--config", "/etc/jaeger/config.yaml"]
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}   # read by config.yaml (${env:OPENSEARCH_PASSWORD})
    volumes:
      - ./config/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    expose:
      - "16686"          # Jaeger UI/API (via APISIX /jaeger only)
      - "4317"           # OTLP gRPC (Mule workers, inside the network only)
      - "4318"           # OTLP HTTP (from outside only via APISIX /otlp, token-checked)
      - "8888"           # own metrics (Prometheus)
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.13
      ce-base-network:
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:13133/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  #
  # Apache APISIX - API Gateway (standalone mode: config/apisix/apisix.yaml is the only route source)
  # start.sh renders routes + certs/apisix into the live config and hot-reloads on change.
  # No depends_on: upstreams are resolved per request, so the gateway comes up even if a backend is down.
  #
  apisix:
    image: apache/apisix:3.19.0-debian
    container_name: apisix
    entrypoint: ["/bin/sh", "/apisix-src/start.sh"]
    environment:
      # off = strip openid-connect from the routes (lite installs without the `auth` profile)
      - GATEWAY_AUTH=${GATEWAY_AUTH:-on}
      # key of the /otlp route (CloudHub traces); start.sh renders it into the route config
      - OTLP_INGEST_TOKEN=${OTLP_INGEST_TOKEN:-}
      # header the /log-archiver route sends (the archiver only answers the gateway)
      - LOG_ARCHIVER_TOKEN=${LOG_ARCHIVER_TOKEN:-}
      - MULE_GATEWAY_CLIENT_SECRET=${MULE_GATEWAY_CLIENT_SECRET}
      # single sign-on of the home page and /jaeger, /prometheus, /activemq (Keycloak client gateway-sso)
      - GATEWAY_SSO_CLIENT_SECRET=${GATEWAY_SSO_CLIENT_SECRET}
      - GATEWAY_SESSION_SECRET=${GATEWAY_SESSION_SECRET}
      # /activemq signs in to the console for the user (its own login stays for direct access)
      - ACTIVEMQ_ADMIN_PASSWORD=${ACTIVEMQ_ADMIN_PASSWORD:-}
      # basic-auth password (user ops) of /jaeger, /prometheus, /activemq when GATEWAY_AUTH=off (no Keycloak)
      - GATEWAY_OPS_PASSWORD=${GATEWAY_OPS_PASSWORD}
      # extra names/IPs for the generated gateway certificate (worker nodes reach the platform at one of them)
      - GATEWAY_HOSTNAMES=${GATEWAY_HOSTNAMES:-}
    volumes:
      - ./config/apisix/config/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./config/apisix:/apisix-src:ro
      # read-write: on first start start.sh creates certs/ca + certs/apisix if they don't exist
      - ./certs:/certs
      - apisix-logs:/usr/local/apisix/logs
    ports:
      - "127.0.0.1:9080:9080"    # HTTP Gateway: cleartext, host only (remote clients use 9443)
      - "9443:9443"    # HTTPS Gateway (cert from certs/apisix; created on first start if missing)
      - "127.0.0.1:9091:9091"    # Prometheus Metrics (no auth: host only)
      - "9100:9100/tcp"  # Stream proxy: log ingestion (fluent-bit:5000; CloudHub log4j Socket appender)
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.20
      ce-base-network:
    healthcheck:
      # Control API answers only once APISIX workers are running with a loaded config.
      # The image has no curl/wget, so speak HTTP over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092 && printf 'GET /v1/schema HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: always

  #
  # Prometheus - Metrics Collection and Storage
  #
  prometheus:
    profiles: [monitoring, alerting]
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    environment:   # external_labels in prometheus.yml
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - OPENSEARCH_CLUSTER_NAME=${OPENSEARCH_CLUSTER_NAME:-opensearch-cluster}
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      # served under /prometheus by APISIX (prefix stripped): routes stay at /, the UI's links and redirects get the prefix
      - '--web.external-url=https://localhost:9443/prometheus/'
      - '--web.route-prefix=/'
      - '--enable-feature=expand-external-labels'
      # OTLP metrics intake (/api/v1/otlp/v1/metrics): JVM metrics of the Mule workers (otel-mule4-agent)
      - '--web.enable-otlp-receiver'
    # Prometheus accessible via APISIX at /prometheus
    expose:
      - "9090"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.23
      ce-base-network:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  #
  # Grafana - Metrics Visualization and Dashboards
  #
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.4.13
    container_name: grafana
    environment:
      - GF_SERVER_ROOT_URL=https://localhost:9443/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-grafana-admin}   # not "admin": that name signs in from Keycloak
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SECURITY_COOKIE_SAMESITE=lax   # lax: the OAuth state cookie must survive Keycloak's redirect back
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_AUTH_ANONYMOUS_ENABLED=false   # viewers can query Prometheus through datasource proxy
      # single sign-on with Keycloak (client grafana); GATEWAY_AUTH=off turns it off (Grafana reads on/off as bools).
      # Realm role admin = Grafana Admin, anyone else is refused. The local admin login stays at /grafana/login?disableAutoLogin
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GATEWAY_AUTH:-on}
      - GF_AUTH_OAUTH_AUTO_LOGIN=${GATEWAY_AUTH:-on}
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://localhost:9443/auth/realms/mule/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/auth/realms/mule/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/auth/realms/mule/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'admin') && 'Admin'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://localhost:9443/auth/realms/mule/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Flocalhost%3A9443%2F
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # Grafana accessible via APISIX at /grafana
    expose:
      - "3000"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.24
      ce-base-network:
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  #
  # Alertmanager - Alert Notification Manager
  #
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    profiles: [alerting]
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--data.retention=${ALERTMANAGER_RETENTION:-120h}'
      # public URL (links in notifications); its path is also the route prefix: APISIX /alertmanager, Prometheus path_prefix
      - '--web.external-url=${ALERTMANAGER_EXTERNAL_URL:-https://localhost:9443/alertmanager}'
    # Alertmanager accessible via APISIX at /alertmanager (admin SSO)
    expose:
      - "9093"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.25
      ce-base-network:
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/alertmanager/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  #
  # OpenSearch Exporter - Exports OpenSearch metrics to Prometheus
  # Uses the same elasticsearch-exporter as it's compatible with OpenSearch
  #
  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0
    container_name: opensearch-exporter
    profiles: [opensearch-monitoring]
    command:
      - '--es.uri=https://opensearch:9200'
      - '--es.ssl-skip-verify'
      - '--es.all'
      - '--es.indices'
      - '--es.indices_settings'
      - '--es.shards'
      - '--collector.snapshots'
      - '--collector.clustersettings'
      - '--es.timeout=30s'
    environment:
      - ES_USERNAME=admin
      - ES_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    expose:
      - "9114"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.26
      ce-base-network:
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9114/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  #
  # Keycloak - Identity and Access Management
  #
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    environment:
      # master realm admin, created when the DB is empty (Keycloak flags it "temporary": fine on 9080-only master)
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      # public (browser) URL and issuer, the same whether a request comes through APISIX or straight to keycloak:8080
      # (otherwise internal clients get http:// login URLs and a different issuer); backchannel-dynamic keeps the
      # token/jwks URLs of internal callers (APISIX, Grafana, Dashboards, RM) on keycloak:8080
      - KC_HOSTNAME=https://localhost:9443/auth
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true   # /auth/health/ready on the management port 9000
      - KC_CACHE=local   # single node: no cluster discovery
      - KC_HTTP_RELATIVE_PATH=/auth
      # realm import fills ${RM_OIDC_CLIENT_SECRET} in mule-realm.json (runtime-manager client)
      - RM_OIDC_CLIENT_SECRET=${RM_OIDC_CLIENT_SECRET:-}
      # and the seeded realm users / APISIX gateway client
      - KEYCLOAK_REALM_ADMIN_PASSWORD=${KEYCLOAK_REALM_ADMIN_PASSWORD}
      - KEYCLOAK_REALM_DEV_PASSWORD=${KEYCLOAK_REALM_DEV_PASSWORD}
      - MULE_GATEWAY_CLIENT_SECRET=${MULE_GATEWAY_CLIENT_SECRET}
      - DASHBOARDS_OIDC_CLIENT_SECRET=${DASHBOARDS_OIDC_CLIENT_SECRET}
      - GATEWAY_SSO_CLIENT_SECRET=${GATEWAY_SSO_CLIENT_SECRET}
      - GRAFANA_OIDC_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
    # production mode (not start-dev); it builds its optimized config on first start, so startup takes longer.
    # The master realm (server admin) is served on 9080 only (APISIX answers 404 on 9443), so once Keycloak answers it
    # gets frontend URL http://localhost:9080/auth (its console signs in there, not on 9443), sslRequired none (9080 is
    # plain HTTP and Docker's 172.42.x is not a "private" range to Keycloak) and brute-force protection.
    # Keycloak stays PID 1 (exec); the background step gives up after ~5 min (e.g. the admin password was changed).
    entrypoint: ["bash", "-c"]
    command:
      - |
        (k=/opt/keycloak/bin/kcadm.sh
         for i in $$(seq 60); do
           $$k config credentials --server http://localhost:8080/auth --realm master --user "$$KC_BOOTSTRAP_ADMIN_USERNAME"              --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null 2>&1              && $$k update realms/master -s attributes.frontendUrl=http://localhost:9080/auth -s sslRequired=NONE -s bruteForceProtected=true -s failureFactor=10 && break
           sleep 5
         done) &
        exec /opt/keycloak/bin/kc.sh start --import-realm
    volumes:
      - ./config/keycloak/realms:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    # Keycloak accessible via APISIX at /auth
    expose:
      - "8080"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.27
      ce-base-network:
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  #
  # Keycloak Database - PostgreSQL
  #
  keycloak-db:
    profiles: [auth]
    image: postgres:15.19-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.28
      ce-base-network:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  log-archiver-data:
  opensearch-data:
    driver: local
  apisix-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  keycloak-data:
    driver: local
  keycloak-db-data:
    driver: local

# Created by compose (no manual `docker network create`). Must stay IDENTICAL to the
# networks block in the included Mule compose file.
networks:
  ce-base-micronet:
    name: ce-base-micronet
    ipam:
      config:
        - subnet: 172.42.0.0/16
          # containers without a fixed address (the Mule pool workers) get one from the upper half, so a worker
          # started first can never take a service's fixed 172.42.0.x address (MySQL's .3 after a Docker restart)
          ip_range: 172.42.128.0/17
  ce-base-network:
    name: ce-base-network
