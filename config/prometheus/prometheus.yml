# Prometheus scrape config (`monitoring` profile). Edit here; apply with
# ./config/scripts/monitoring/setup-monitoring.sh --reload (restarts Prometheus).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'opensearch-stack-monitor'
    # expanded from the container env (--enable-feature=expand-external-labels; defaults are set in docker-compose.yml)
    environment: '${ENVIRONMENT}'
    cluster: '${OPENSEARCH_CLUSTER_NAME}'

# Alertmanager configuration
alerting:
  alertmanagers:
    # alerting profile; DNS discovery: no Alertmanager running = no target (not an error)
    - dns_sd_configs:
        - names: ['alertmanager']
          type: A
          port: 9093
      scheme: http
      path_prefix: /alertmanager   # Alertmanager runs under /alertmanager (its --web.external-url)
      timeout: 10s

# Load alert rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # APISIX API Gateway metrics
  - job_name: 'apisix'
    static_configs:
      - targets: ['apisix:9091']
        labels:
          service: 'apisix'
          component: 'gateway'
    metrics_path: '/apisix/prometheus/metrics'
    scrape_interval: 10s

  # Grafana metrics (if available)
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'
    metrics_path: '/grafana/metrics'   # Grafana serves from its /grafana sub-path
    scrape_interval: 30s

  # OpenSearch metrics via Exporter
  # Uses opensearch-exporter which is compatible with OpenSearch
  - job_name: 'opensearch-exporter'   # opensearch-monitoring profile (DNS discovery: absent = no target)
    dns_sd_configs:
      - names: ['opensearch-exporter']
        type: A
        port: 9114
    relabel_configs:
      - target_label: service
        replacement: 'opensearch'
      - target_label: component
        replacement: 'search'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'alertmanager'   # alerting profile (DNS discovery: absent = no target)
    dns_sd_configs:
      - names: ['alertmanager']
        type: A
        port: 9093
    relabel_configs:
      - target_label: service
        replacement: 'alertmanager'
      - target_label: component
        replacement: 'alerting'
    metrics_path: '/alertmanager/metrics'
    scrape_interval: 30s

  - job_name: 'fluent-bit'   # log ingestion (logging profile)
    static_configs:
      - targets: ['fluent-bit:2020']
        labels:
          service: 'fluent-bit'
          component: 'pipeline'
    metrics_path: '/api/v1/metrics/prometheus'
    scrape_interval: 30s

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:8888']   # v2 collector metrics
        labels:
          service: 'jaeger'
          component: 'tracing'
    metrics_path: '/metrics'
    scrape_interval: 30s

