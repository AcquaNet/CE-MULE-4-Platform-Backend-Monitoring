# Alertmanager config (`alerting` profile). Default: alerts are received but sent nowhere.
# To send mail: add `alerting` to COMPOSE_PROFILES, set SMTP_* in .env and run
# ./config/scripts/monitoring/setup-monitoring.sh, which regenerates this file from alertmanager.yml.template.

global:
  resolve_timeout: 5m

# Route configuration
route:
  receiver: 'null-receiver'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

# Receivers
receivers:
  # Null receiver - alerts are logged but not sent anywhere
  - name: 'null-receiver'

# Inhibition rules
inhibit_rules:
  # Inhibit warning if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
