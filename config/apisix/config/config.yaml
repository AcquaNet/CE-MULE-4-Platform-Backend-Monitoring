# APISIX Configuration for OpenSearch Stack and Mule Platform Gateway

apisix:
  node_listen: 9080              # HTTP port
  # stream (TCP) proxy only runs with this; without it stream_proxy/stream_routes are silently ignored
  proxy_mode: http&stream
  enable_ipv6: false

  # Stream proxy for TCP traffic (log ingestion)
  # Note: UDP support can be added via stream routes
  stream_proxy:
    tcp:
      - addr: 9100              # TCP log ingestion (Fluent Bit :5000)

  # HTTPS on 9443 (APISIX default listener). Served whenever certs/apisix exists;
  # the cert is injected into apisix.yaml by config/apisix/start.sh.
  enable_http2: true              # all TLS listeners (3.9+: no per-port enable_http2)
  ssl:
    enable: true
    listen:
      - port: 9443
    ssl_protocols: "TLSv1.2 TLSv1.3"
    fallback_sni: "localhost"     # any hostname/IP without its own cert gets the default one

  enable_control: true            # also used by the container healthcheck
  extra_lua_path: "/apisix-src/lua/?.lua"   # lua/apisix/control/v1.lua: fixes the Control API dump 500s
  control:
    ip: "127.0.0.1"               # no auth, dumps the rendered config (secrets); no curl in the image: docker run --rm --network container:apisix curlimages/curl:8.10.1 -s http://127.0.0.1:9092/v1/healthcheck
    port: 9092

# Standalone mode: routes come only from conf/apisix.yaml (no etcd, no Admin API).
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091

nginx_config:
  # default is one worker per CPU core (~36 MB each); 2 is plenty below thousands of req/s
  worker_processes: 2
  error_log: "/usr/local/apisix/logs/error.log"
  error_log_level: "warn"

  http:
    access_log: "/usr/local/apisix/logs/access.log"

    # Enable real IP forwarding
    real_ip_header: "X-Real-IP"
    real_ip_recursive: "off"

    # Increase timeouts for long-running Mule requests
    proxy_connect_timeout: 60s
    proxy_send_timeout: 60s
    proxy_read_timeout: 60s

    # Buffer settings
    client_max_body_size: 50m
    client_body_buffer_size: 512k

  # Dashboards' openid login answers with big Set-Cookie headers (ID + refresh token): nginx's default
  # 4k/8k response-header buffer 502s it ("upstream sent too big header")
  http_configuration_snippet: |
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

  # Enable stream (TCP/UDP) proxy (log ingestion)
  stream:
    enable_access_log: true
    access_log: "/usr/local/apisix/logs/stream-access.log"
    access_log_format: "$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time"

plugins:   # only what apisix.yaml and the Runtime Manager's routes use: every enabled plugin is attack surface
  - client-control
  - mocking
  - serverless-pre-function
  - cors
  - uri-blocker
  - openid-connect
  - basic-auth
  - key-auth
  - proxy-rewrite
  - limit-conn
  - limit-count
  - redirect
  - response-rewrite
  - prometheus
  - serverless-post-function

stream_plugins: []   # the 9100 stream route uses none
