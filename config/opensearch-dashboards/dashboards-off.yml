# OpenSearch Dashboards without Keycloak (GATEWAY_AUTH=off): sign in with an OpenSearch user (admin /
# OPENSEARCH_ADMIN_PASSWORD, or a tenant user from manage-tenants.sh). See dashboards-on.yml for the SSO variant.
server.host: "0.0.0.0"
opensearch.ssl.verificationMode: none
opensearch.requestHeadersWhitelist: [authorization, securitytenant]

opensearch_security.cookie.secure: false   # also usable over http://localhost:9080/dashboards
opensearch_security.multitenancy.enabled: true
opensearch_security.multitenancy.tenants.preferred: [Private, Global]
opensearch_security.readonly_mode.roles: [kibana_read_only]
