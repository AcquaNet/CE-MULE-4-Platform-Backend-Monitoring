# Log ingestion: JSON events over TCP/UDP 5000 (Mule log4j Socket appender, Docker or CloudHub via
# APISIX :9100) -> checks + normalization (pipeline.lua) -> OpenSearch mule-logs-YYYY.MM.DD (Mule events)
# or logstash-YYYY.MM.DD (anything else). Same contract the old Logstash pipeline had: every event needs
# auth_token = LOG_INGEST_TOKEN, or it is dropped.

[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On

[INPUT]
    Name    tcp
    Listen  0.0.0.0
    Port    5000
    Format  json
    Tag     ingest

[INPUT]
    Name    udp
    Listen  0.0.0.0
    Port    5000
    Format  json
    Tag     ingest

# a JSON object inside "message" is merged into the event (message itself is kept)
[FILTER]
    Name          parser
    Match         ingest
    Key_Name      message
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

# auth token, tenant_id, timestamp, field cleanup, route (mule|other)
[FILTER]
    Name    lua
    Match   ingest
    Script  pipeline.lua
    Call    process

# one tag per destination index, then drop the routing field
[FILTER]
    Name   rewrite_tag
    Match  ingest
    Rule   $route ^(mule|other)$ ingest.$1 false

[FILTER]
    Name        record_modifier
    Match       ingest.*
    Remove_key  route

[OUTPUT]
    Name                 opensearch
    Match                ingest.mule
    Host                 opensearch
    Port                 9200
    tls                  On
    tls.verify           Off
    HTTP_User            admin
    HTTP_Passwd          ${OPENSEARCH_PASSWORD}
    Logstash_Format      On
    Logstash_Prefix      mule-logs
    Logstash_DateFormat  %Y.%m.%d
    Time_Key             @timestamp
    Suppress_Type_Name   On
    Trace_Error          On
    Retry_Limit          5

[OUTPUT]
    Name                 opensearch
    Match                ingest.other
    Host                 opensearch
    Port                 9200
    tls                  On
    tls.verify           Off
    HTTP_User            admin
    HTTP_Passwd          ${OPENSEARCH_PASSWORD}
    Logstash_Format      On
    Logstash_Prefix      logstash
    Logstash_DateFormat  %Y.%m.%d
    Time_Key             @timestamp
    Suppress_Type_Name   On
    Trace_Error          On
    Retry_Limit          5
